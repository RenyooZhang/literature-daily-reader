<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>领域文献日报 · 2026-11-16</title>
<style>:root { color-scheme: light; }
* { box-sizing: border-box; }
html { background: #FFFFFF; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #FFFFFF; color: #17202C;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  font-size: 15.5px; line-height: 1.8; }
.digest { width: 100%; max-width: 720px; margin: 0 auto; padding: 28px 20px 44px;
  overflow-wrap: anywhere; word-break: normal; }
.digest-header { border-bottom: 1px solid #E0E5EB; padding-bottom: 20px; margin-bottom: 20px; }
.eyebrow { color: #64748B; font-family: Georgia, "Times New Roman", serif;
  font-size: 13px; line-height: 1.5; margin: 0 0 8px; }
.digest-title { margin: 0 0 7px; font-size: 32px; line-height: 1.35; font-weight: 700;
  font-family: "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", SimSun, serif; }
.digest-date { color: #64748B; font-size: 14px; margin: 0; line-height: 1.6; }
.paper + .paper { border-top: 1px solid #E0E5EB; padding-top: 20px; margin-top: 28px; }
.paper-number { color: #1757A6; font-family: Georgia, "Times New Roman", serif;
  font-size: 26px; line-height: 1.2; font-weight: 700; margin: 0 0 5px; }
.paper-meta, .paper-authors { color: #64748B; font-size: 12.5px; line-height: 1.65; margin: 0; }
.paper-title { font-family: Georgia, "Times New Roman", serif; font-size: 22px;
  font-weight: 700; line-height: 1.3; margin: 7px 0 8px; color: #17202C; }
.paper-title-zh { font-family: "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", SimSun, serif;
  font-size: 17px; line-height: 1.65; margin: 0 0 8px; }
.paper-authors { margin-bottom: 3px; }
.paper-section { margin-top: 22px; }
.paper-section h3 { color: #1757A6; font-size: 15.5px; line-height: 1.6;
  font-weight: 700; margin: 0 0 6px; }
.paper-section p { margin: 0; }
.paper-section p + p { margin-top: 10px; }
.paper-section ol { margin: 0; padding-left: 1.4em; }
.paper-section li { padding-left: 2px; margin: 3px 0; }
.abstract-en p { font-family: Georgia, "Times New Roman", serif; font-size: 15.5px; line-height: 1.75; }
.paper-figure { margin: 21px 0 0; }
.paper-figure img { display: block; width: auto; max-width: 100%; height: auto; margin: 0 auto; }
.paper-figure figcaption { color: #64748B; font-size: 12px; line-height: 1.65; margin-top: 8px; }
.figure-source { margin-left: 6px; }
a { color: #1764B3; text-decoration: underline; text-underline-offset: 3px; }
.paper-links { font-size: 14px; line-height: 1.8; margin: 20px 0 0; }
.link-divider { color: #64748B; margin: 0 7px; }
.digest-footer { border-top: 1px solid #E0E5EB; margin-top: 28px; padding-top: 15px;
  color: #64748B; font-size: 12px; line-height: 1.75; }
.digest-footer p { margin: 0 0 8px; }
.empty-digest { margin: 24px 0; }
@media (min-width: 760px) { .digest { padding-top: 42px; padding-bottom: 56px; } }</style>
</head>
<body>
<main class="digest">
<header class="digest-header">
<p class="eyebrow">Computational Microscopy · Daily Digest</p>
<h1 class="digest-title">领域文献日报</h1>
<p class="digest-date"><time datetime="2026-11-16">2026 年 11 月 16 日</time></p>
</header>
<p class="empty-digest">本期未发现达到相关性阈值的新文献。</p>
<footer class="digest-footer">
<p>openalex 暂时不可用；arxiv 暂时不可用，本期检索可能不完整。</p>
<p>中文内容依据论文公开资料整理，请以原文为准。</p>
</footer>
</main>
</body>
</html>
